name: Dependency security

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit locked npm and Rust dependencies
        run: node scripts/audit-dependencies.mjs
      - name: Verify audit and patch integrity regressions
        run: |
          node scripts/check-dependency-audit.mjs
          node scripts/check-vendored-patches.mjs
