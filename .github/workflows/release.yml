name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag before building or publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/validate-release-tag.mjs

  checks:
    needs: validate-release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: checks
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-14
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
              /^---$/ { if (found) exit }
              found { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Session Viewer ${{ github.ref_name }}'
          releaseBody: |
            ${{ steps.changelog.outputs.body }}

            ## Downloads

            | Platform | Installer | Portable |
            |----------|-----------|----------|
            | Windows | `.msi` / `.exe` (NSIS) | `*-portable.zip` |
            | macOS (Universal) | `.dmg` | — |
            | Linux | `.deb` / `.AppImage` | — |

            > Windows 便携版解压即用，无需安装。需要系统已安装 WebView2（Win10/11 默认内置）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Windows portable: zip the raw exe and upload to the same release
      - name: Create Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exePath = "target/release/ai-session-viewer.exe"
          if (Test-Path $exePath) {
            $zipName = "ai-session-viewer-{0}-windows-portable.zip" -f $env:RELEASE_TAG
            Compress-Archive -Path $exePath -DestinationPath $zipName
            Write-Output "PORTABLE_ZIP=$zipName" >> $env:GITHUB_OUTPUT
            Write-Output "Created portable zip: $zipName"
          } else {
            Write-Error "Executable not found at $exePath"
            exit 1
          }
        id: portable

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE_ZIP: ${{ steps.portable.outputs.PORTABLE_ZIP }}
        run: |
          gh release upload "$RELEASE_TAG" "$PORTABLE_ZIP" --clobber

  web-server:
    needs: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (web mode)
        run: npm run build:web

      - name: Build web server (static musl)
        run: cargo build --locked -p session-web --release --target x86_64-unknown-linux-musl

      - name: Package web server
        run: |
          tar -czf "session-web-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            -C target/x86_64-unknown-linux-musl/release session-web

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "session-web-${RELEASE_TAG}-linux-x86_64.tar.gz" --clobber


  docker:
    runs-on: ubuntu-22.04
    needs: web-server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
