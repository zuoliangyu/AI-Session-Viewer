services:
  session-viewer:
    # Verified published 3.2.0 image. Override ASV_IMAGE explicitly when upgrading.
    image: ${ASV_IMAGE:-ghcr.io/zuoliangyu/ai-session-viewer-web:3.2.0@sha256:6fa177f9a7961543b6eaf27f37de63698e85a69bb0e19fcac244ebc26ba6d5c9}
    ports:
      - "3000:3000"
    volumes:
      # 挂载 Claude Code 会话数据（只读）
      # 没有使用 Claude Code 可以注释掉
      - ~/.claude:/root/.claude:ro

      # 挂载 Codex CLI 会话数据（只读）
      # 没有使用 Codex CLI 可以注释掉
      - ~/.codex:/root/.codex:ro

    environment:
      # Bearer Token 认证（容器监听 0.0.0.0，必须设置，否则服务拒绝启动）
      # 用法：ASV_TOKEN=my-secret docker compose up -d
      ASV_TOKEN: ${ASV_TOKEN:?请设置 ASV_TOKEN}
